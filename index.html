<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #050505, #101820);
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   LOGIN
========================= */

#authScreen {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.auth-box {
    width: 90%;
    max-width: 400px;
    background: rgba(15, 20, 25, 0.95);
    border: 1px solid #00c8ff;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 0 25px rgba(0, 200, 255, 0.25);
}

.logo {
    text-align: center;
    color: #00c8ff;
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

.auth-box input {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #344;
    background: #080c10;
    color: white;
    font-size: 16px;
}

.auth-box button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #00aeea;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.auth-box button:hover {
    background: #008ec0;
}

#switchButton {
    background: #252d35;
}

#errorMessage {
    color: #ff5555;
    text-align: center;
    margin-top: 15px;
}

/* =========================
   APP
========================= */

#appScreen {
    display: none;
    height: 100vh;
}

.topbar {
    height: 65px;
    background: #080d12;
    border-bottom: 1px solid #24313a;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;
}

.topbar-title {
    color: #00c8ff;
    font-size: 24px;
    font-weight: bold;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

#loggedUsername {
    color: #888;
    margin-right: 5px;
}

.topbar button {
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    color: white;
    background: #26333d;
    cursor: pointer;
}

.topbar button:hover {
    background: #34444f;
}

#logoutButton {
    background: #7d2630;
}

#logoutButton:hover {
    background: #a32d39;
}

/* =========================
   CHAT
========================= */

.chat {
    height: calc(100vh - 65px);
    display: flex;
    flex-direction: column;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 800px;
    margin: 0 auto 15px auto;
    padding: 13px 16px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
}

.user {
    background: #12384d;
    margin-right: 0;
}

.jarvis {
    background: #151c22;
    border: 1px solid #26343d;
    margin-left: 0;
}

.message-name {
    color: #00c8ff;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 5px;
}

/* =========================
   INPUT
========================= */

.input-area {
    background: #080d12;
    border-top: 1px solid #24313a;
    padding: 12px;
}

.input-container {
    max-width: 900px;
    margin: auto;

    display: flex;
    gap: 7px;
}

#messageInput {
    flex: 1;
    margin: 0;
    padding: 13px;

    border: 1px solid #34434d;
    border-radius: 8px;

    background: #10161b;
    color: white;

    outline: none;
    font-size: 16px;
}

#messageInput:focus {
    border-color: #00c8ff;
}

.input-container button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;

    background: #00aeea;
    color: white;

    cursor: pointer;
    font-weight: bold;
}

#micButton {
    background: #26333d;
}

/* =========================
   PAINEL DE MEMÓRIA
========================= */

#memoryOverlay {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.55);

    z-index: 50;
}

#memoryOverlay.show {
    display: block;
}

#memoryPanel {
    position: fixed;

    top: 0;
    right: -390px;

    width: 370px;
    max-width: 90%;

    height: 100vh;

    background: #0b1116;

    border-left: 1px solid #00c8ff;

    z-index: 100;

    transition: right 0.3s ease;

    display: flex;
    flex-direction: column;
}

#memoryPanel.show {
    right: 0;
}

.memory-header {
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    border-bottom: 1px solid #26343d;
}

.memory-header h2 {
    margin: 0;
    color: #00c8ff;
    font-size: 21px;
}

.memory-header button {
    border: none;
    border-radius: 7px;

    background: #26333d;
    color: white;

    padding: 8px 12px;

    cursor: pointer;
}

.memory-description {
    padding: 15px;

    color: #888;

    font-size: 13px;

    border-bottom: 1px solid #202a31;
}

#memoryList {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.memory {
    background: #151d23;

    border: 1px solid #26343d;

    border-radius: 9px;

    padding: 12px;

    margin-bottom: 10px;
}

.memory-text {
    color: white;
    line-height: 1.4;
}

.memory-date {
    color: #65727c;
    font-size: 11px;
    margin-top: 7px;
}

.memory-delete {
    margin-top: 9px;

    border: none;
    border-radius: 6px;

    padding: 6px 9px;

    background: #7d2630;
    color: white;

    cursor: pointer;
}

.no-memory {
    text-align: center;
    color: #65727c;
    padding: 30px 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .topbar-title {
        font-size: 20px;
    }

    #loggedUsername {
        display: none;
    }

    .topbar button {
        padding: 8px;
        font-size: 12px;
    }

    #memoryPanel {
        width: 340px;
    }

    .message {
        font-size: 14px;
    }

    .input-container {
        gap: 5px;
    }

    .input-container button {
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="authScreen">

    <div class="auth-box">

        <div class="logo">
            JARVIS
        </div>

        <div
            class="subtitle"
            id="authSubtitle"
        >
            Entra na tua conta
        </div>

        <input
            id="usernameInput"
            type="text"
            placeholder="Nome de utilizador"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Palavra-passe"
        >

        <button
            id="authButton"
            onclick="authAction()"
        >
            Entrar
        </button>

        <button
            id="switchButton"
            onclick="switchAuthMode()"
        >
            Criar conta
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- =========================
     JARVIS
========================= -->

<div id="appScreen">

    <div class="topbar">

        <div class="topbar-title">
            JARVIS
        </div>

        <div class="topbar-right">

            <span id="loggedUsername"></span>

            <button
                onclick="openMemoryPanel()"
            >
                🧠 Memória
            </button>

            <button
                id="logoutButton"
                onclick="logout()"
            >
                Sair
            </button>

        </div>

    </div>


    <div class="chat">

        <div id="messages">

            <div class="message jarvis">

                <div class="message-name">
                    JARVIS
                </div>

                Olá! Sou o JARVIS. Como posso ajudar?

            </div>

        </div>


        <div class="input-area">

            <div class="input-container">

                <button
                    id="micButton"
                    onclick="startVoice()"
                >
                    🎤
                </button>

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Escreve uma mensagem..."
                    onkeydown="handleEnter(event)"
                >

                <button
                    onclick="sendMessage()"
                >
                    Enviar
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     MEMÓRIA
========================= -->

<div
    id="memoryOverlay"
    onclick="closeMemoryPanel()"
></div>


<div id="memoryPanel">

    <div class="memory-header">

        <h2>
            🧠 Memória
        </h2>

        <button
            onclick="closeMemoryPanel()"
        >
            ✕
        </button>

    </div>

    <div class="memory-description">

        O JARVIS guarda automaticamente informações
        importantes que aprende durante as conversas.

    </div>

    <div id="memoryList">

        <div class="no-memory">
            A carregar memórias...
        </div>

    </div>

</div>


<script>

/* =========================
   CONFIGURAÇÃO
========================= */

const WORKER_URL =
    "https://jarvis.2024guiteles.workers.dev";

let token =
    localStorage.getItem("jarvis_token");

let currentUsername = "";

let authMode = "login";

let conversation = [];


/* =========================
   ELEMENTOS
========================= */

const authScreen =
    document.getElementById("authScreen");

const appScreen =
    document.getElementById("appScreen");

const usernameInput =
    document.getElementById("usernameInput");

const passwordInput =
    document.getElementById("passwordInput");

const authButton =
    document.getElementById("authButton");

const switchButton =
    document.getElementById("switchButton");

const authSubtitle =
    document.getElementById("authSubtitle");

const errorMessage =
    document.getElementById("errorMessage");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const loggedUsername =
    document.getElementById("loggedUsername");

const memoryPanel =
    document.getElementById("memoryPanel");

const memoryOverlay =
    document.getElementById("memoryOverlay");

const memoryList =
    document.getElementById("memoryList");


/* =========================
   LOGIN / REGISTO
========================= */

function switchAuthMode() {

    if (authMode === "login") {

        authMode = "register";

        authSubtitle.textContent =
            "Cria a tua conta JARVIS";

        authButton.textContent =
            "Criar conta";

        switchButton.textContent =
            "Já tenho uma conta";

    } else {

        authMode = "login";

        authSubtitle.textContent =
            "Entra na tua conta";

        authButton.textContent =
            "Entrar";

        switchButton.textContent =
            "Criar conta";
    }

    errorMessage.textContent = "";
}


async function authAction() {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    errorMessage.textContent = "";

    if (!username || !password) {

        errorMessage.textContent =
            "Preenche todos os campos.";

        return;
    }

    authButton.disabled = true;

    try {

        const endpoint =
            authMode === "login"
                ? "/login"
                : "/register";

        const response =
            await fetch(
                WORKER_URL + endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro no servidor."
            );
        }

        if (authMode === "register") {

            alert(
                "Conta criada com sucesso!"
            );

            authMode = "login";

            authSubtitle.textContent =
                "Entra na tua conta";

            authButton.textContent =
                "Entrar";

            switchButton.textContent =
                "Criar conta";

            passwordInput.value = "";

            return;
        }

        token = data.token;

        currentUsername =
            data.username;

        localStorage.setItem(
            "jarvis_token",
            token
        );

        showApp();

    } catch (error) {

        errorMessage.textContent =
            error.message;

    } finally {

        authButton.disabled = false;
    }
}


/* =========================
   LOGIN AUTOMÁTICO
========================= */

async function checkLogin() {

    if (!token) {

        showAuth();

        return;
    }

    try {

        const response =
            await fetch(
                WORKER_URL + "/me",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );

        const data =
            await response.json();

        if (!data.autenticado) {

            localStorage.removeItem(
                "jarvis_token"
            );

            token = null;

            showAuth();

            return;
        }

        currentUsername =
            data.username;

        showApp();

    } catch (error) {

        showAuth();
    }
}


function showApp() {

    authScreen.style.display =
        "none";

    appScreen.style.display =
        "block";

    loggedUsername.textContent =
        "Olá, " + currentUsername;

    messageInput.focus();
}


function showAuth() {

    authScreen.style.display =
        "flex";

    appScreen.style.display =
        "none";
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    try {

        if (token) {

            await fetch(
                WORKER_URL + "/logout",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );
        }

    } catch (error) {}

    localStorage.removeItem(
        "jarvis_token"
    );

    token = null;

    conversation = [];

    showAuth();
}


/* =========================
   CHAT
========================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;

    messageInput.value = "";

    addMessage(
        "user",
        text
    );

    conversation.push({
        role: "user",
        content: text
    });

    const loading =
        addMessage(
            "jarvis",
            "A pensar..."
        );

    try {

        const response =
            await fetch(
                WORKER_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        messages:
                            conversation
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro no servidor."
            );
        }

        loading.remove();

        const answer =
            data.resposta ||
            "Não recebi uma resposta.";

        addMessage(
            "jarvis",
            answer
        );

        conversation.push({
            role: "assistant",
            content: answer
        });

        speak(answer);

    } catch (error) {

        loading.remove();

        addMessage(
            "jarvis",
            "Erro: " + error.message
        );
    }
}


function addMessage(
    type,
    text
) {

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            type === "user"
                ? "user"
                : "jarvis"
        );

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        type === "user"
            ? "TU"
            : "JARVIS";

    const content =
        document.createElement("div");

    content.textContent =
        text;

    div.appendChild(name);

    div.appendChild(content);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

    return div;
}


function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================
   VOZ
========================= */

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang =
        "pt-PT";

    utterance.rate =
        1;

    speechSynthesis.speak(
        utterance
    );
}


/* =========================
   MICROFONE
========================= */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {

        alert(
            "O teu navegador não suporta reconhecimento de voz."
        );

        return;
    }

    const recognition =
        new Recognition();

    recognition.lang =
        "pt-PT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.start();

    recognition.onresult =
        function(event) {

            messageInput.value =
                event.results[0][0]
                    .transcript;

            sendMessage();
        };
}


/* =========================
   MEMÓRIA
========================= */

function openMemoryPanel() {

    memoryPanel.classList.add("show");

    memoryOverlay.classList.add("show");

    loadMemories();
}


function closeMemoryPanel() {

    memoryPanel.classList.remove("show");

    memoryOverlay.classList.remove("show");
}


async function loadMemories() {

    memoryList.innerHTML =
        `<div class="no-memory">
            A carregar memórias...
        </div>`;

    try {

        const response =
            await fetch(
                WORKER_URL + "/memories",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao carregar memórias."
            );
        }

        renderMemories(
            data.memorias || []
        );

    } catch (error) {

        memoryList.innerHTML =
            `<div class="no-memory">
                Erro:<br><br>
                ${escapeHTML(error.message)}
            </div>`;
    }
}


function renderMemories(memories) {

    if (memories.length === 0) {

        memoryList.innerHTML =
            `<div class="no-memory">
                🧠<br><br>
                Ainda não tenho memórias guardadas.
                <br><br>
                Continua a conversar com o JARVIS.
            </div>`;

        return;
    }

    memoryList.innerHTML = "";

    memories.forEach(
        memory => {

            const item =
                document.createElement("div");

            item.className =
                "memory";

            const text =
                document.createElement("div");

            text.className =
                "memory-text";

            text.textContent =
                memory.memory;

            const date =
                document.createElement("div");

            date.className =
                "memory-date";

            date.textContent =
                memory.created_at
                    ? "Guardada em " +
                      memory.created_at
                    : "";

            const button =
                document.createElement("button");

            button.className =
                "memory-delete";

            button.textContent =
                "🗑️ Esquecer";

            button.onclick =
                function() {

                    deleteMemory(
                        memory.id
                    );
                };

            item.appendChild(text);

            item.appendChild(date);

            item.appendChild(button);

            memoryList.appendChild(item);
        }
    );
}


async function deleteMemory(id) {

    try {

        const response =
            await fetch(
                WORKER_URL + "/forget",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        id: id
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao apagar memória."
            );
        }

        loadMemories();

    } catch (error) {

        alert(
            "Erro: " +
            error.message
        );
    }
}


/* =========================
   SEGURANÇA
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================
   INICIAR
========================= */

checkLogin();

</script>

</body>
</html>
