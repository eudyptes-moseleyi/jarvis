<!DOCTYPE html>

<head>

<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #06252b 0%, #02090c 45%, #000 100%);
    color: #00f6ff;

}

.hidden {

}

/* =========================
   LOGIN / CADASTRO
========================= */

#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.auth-box {
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border: 1px solid #00eaff;

    background: rgba(0, 15, 20, 0.92);

}

.logo {

    cursor: pointer;
}

.auth-button:hover {
    background: #5df6ff;
    box-shadow: 0 0 18px rgba(0,234,255,.45);
}

.switch-button {
    display: block;
    width: 100%;
    margin-top: 18px;

    color: #00eaff;

}

    min-height: 22px;

    color: #ff8585;
}

/* =========================
   JARVIS
========================= */

#app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid rgba(0,234,255,.25);
    background: rgba(0,10,13,.75);
}

.header-title {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 0 15px #00eaff;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

#usernameDisplay {
    color: #a9f9ff;
}

.logout-button {
    padding: 8px 13px;
    border: 1px solid #00eaff;
    border-radius: 8px;
    background: transparent;
    color: #00eaff;
    cursor: pointer;
}

.logout-button:hover {
    background: rgba(0,234,255,.12);
}

/* CORE */

.core-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 35px 20px 15px;
}

.core {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 3px solid #00eaff;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    box-shadow:
        0 0 20px #00eaff,
        0 0 60px rgba(0,234,255,.45),
        inset 0 0 25px rgba(0,234,255,.5);
    animation: pulse 2s infinite ease-in-out;
}

.core::before,
.core::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,234,255,.7);
}

.core::before {
    width: 115px;
    height: 115px;
    animation: spin 5s linear infinite;
}

.core::after {
    width: 80px;
    height: 80px;
    animation: spinReverse 3s linear infinite;
}

.core-center {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #00eaff;
    box-shadow: 0 0 25px #00eaff;
    z-index: 2;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.06);
    }
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {
    from {
        transform: rotate(360deg);
    }
    to {
        transform: rotate(0deg);
    }
}

/* CHAT */

.chat {
    width: min(900px, 94%);
    margin: 0 auto;
    flex: 1;
    min-height: 280px;
    max-height: 48vh;
    overflow-y: auto;
    padding: 10px 5px 20px;
}

.message {
    margin: 10px 0;
    padding: 13px 16px;
    border-radius: 15px;
    max-width: 80%;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user-message {
    margin-left: auto;
    background: rgba(0,180,200,.16);
    border: 1px solid rgba(0,234,255,.35);
    color: white;
}

.jarvis-message {
    margin-right: auto;
    background: rgba(0,30,35,.8);
    border: 1px solid rgba(0,234,255,.3);
    color: #b8fbff;
}

.status {
    width: min(900px, 94%);
    margin: 0 auto;
    padding: 5px;
    color: #6ddde5;
    font-size: 13px;
}

/* INPUT */

.input-area {
    width: min(900px, 94%);
    margin: 0 auto;
    padding: 15px 0 25px;
    display: flex;
    gap: 8px;
}

#userInput {
    flex: 1;
    padding: 14px;
    border: 1px solid #087985;
    border-radius: 12px;
    background: #031317;
    color: white;
    font-size: 16px;
    outline: none;
}

#userInput:focus {
    border-color: #00eaff;
}

.action-button {
    min-width: 52px;
    border: 1px solid #00eaff;
    border-radius: 12px;
    background: rgba(0,234,255,.08);
    color: #00eaff;
    cursor: pointer;
    font-size: 20px;
}

.action-button:hover {
    background: rgba(0,234,255,.2);
}

.send-button {
    min-width: 90px;
    font-size: 15px;
    font-weight: bold;
}

/* QUICK COMMANDS */

.quick {
    width: min(900px, 94%);
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.quick button {
    padding: 7px 10px;
    border: 1px solid rgba(0,234,255,.3);
    border-radius: 8px;
    background: transparent;
    color: #7cebf1;
    cursor: pointer;
}

.quick button:hover {
    background: rgba(0,234,255,.12);
}
</style>
</head>

<body>

<!-- =========================
     AUTENTICAÇÃO
========================= -->

<div id="authScreen">

    <div class="auth-box">

        <div class="logo">JARVIS</div>

        <div class="subtitle" id="authTitle">
            Criar a tua conta
        </div>

        <input
            id="username"
            type="text"
            placeholder="Nome de utilizador"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Palavra-passe"
            autocomplete="current-password"
        >

        <button
            class="auth-button"
            id="authButton"
            onclick="autenticar()"
        >
            Criar conta
        </button>

        <button
            class="switch-button"
            id="switchButton"
            onclick="trocarModo()"
        >
            Já tens uma conta? Entrar
        </button>

        <div id="authMessage"></div>

    </div>

</div>


<!-- =========================
     APLICAÇÃO
========================= -->

<div id="app" class="hidden">

    <header>

        <div class="header-title">
            JARVIS
        </div>

        <div class="user-area">

            <span id="usernameDisplay"></span>

            <button
                class="logout-button"
                onclick="logout()"
            >
                Sair
            </button>

        </div>

    </header>


    <div class="core-area">

        <div class="core">
            <div class="core-center"></div>
        </div>

    </div>


    <div id="chat" class="chat"></div>

    <div id="status" class="status">
        JARVIS online
    </div>


    <div class="quick">

        <button onclick="comandoRapido('Que horas são?')">
            🕐 Hora
        </button>

        <button onclick="comandoRapido('Que dia é hoje?')">
            📅 Data
        </button>

        <button onclick="comandoRapido('Conta-me uma piada.')">
            😄 Piada
        </button>

        <button onclick="comandoRapido('Ajuda')">
            ❓ Ajuda
        </button>

    </div>


    <div class="input-area">

        <input
            id="userInput"
            type="text"
            placeholder="Fala com o JARVIS..."
        >

        <button
            class="action-button"
            onclick="ouvir()"
            title="Microfone"
        >
            🎤
        </button>

        <button
            class="action-button send-button"
            onclick="enviar()"
        >
            Enviar
        </button>

    </div>

</div>


<script>

const WORKER_URL =
    "https://jarvis.2024guiteles.workers.dev";

let modoCadastro = true;
let token = localStorage.getItem("jarvis_token");
let historico = [];


// =========================
// AUTENTICAÇÃO
// =========================

function trocarModo() {

    modoCadastro = !modoCadastro;

    const title =
        document.getElementById("authTitle");

    const button =
        document.getElementById("authButton");

    const switchButton =
        document.getElementById("switchButton");

    document.getElementById("authMessage").textContent = "";

    if (modoCadastro) {

        title.textContent =
            "Criar a tua conta";

        button.textContent =
            "Criar conta";

        switchButton.textContent =
            "Já tens uma conta? Entrar";

    } else {

        title.textContent =
            "Entrar no JARVIS";

        button.textContent =
            "Entrar";

        switchButton.textContent =
            "Ainda não tens conta? Criar conta";
    }
}


async function autenticar() {

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("authMessage");

    if (!username || !password) {

        message.textContent =
            "Preenche todos os campos.";

        return;
    }

    message.textContent =
        "A processar...";

    const rota =
        modoCadastro
            ? "/register"
            : "/login";

    try {

        const response = await fetch(
            WORKER_URL + rota,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            message.textContent =
                data.erro ||
                "Ocorreu um erro.";

            return;
        }

        if (modoCadastro) {

            message.style.color =
                "#71ff91";

            message.textContent =
                "Conta criada! A entrar...";

            modoCadastro = false;

            setTimeout(() => {
                autenticar();
            }, 500);

            return;
        }

        token = data.token;

        localStorage.setItem(
            "jarvis_token",
            token
        );

        mostrarAplicacao(
            data.username
        );

    } catch (erro) {

        message.textContent =
            "Não foi possível contactar o servidor.";
    }
}


// =========================
// MOSTRAR JARVIS
// =========================

function mostrarAplicacao(username) {

    document
        .getElementById("authScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("usernameDisplay")
        .textContent =
            "Olá, " + username;

    adicionarMensagem(
        "jarvis",
        "Olá, " + username +
        "! Sou o JARVIS. Como posso ajudar?"
    );
}


// =========================
// LOGOUT
// =========================

async function logout() {

    try {

        await fetch(
            WORKER_URL + "/logout",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    token: token
                })
            }
        );

    } catch (erro) {
        // Mesmo que o pedido falhe,
        // terminamos a sessão local.
    }

    localStorage.removeItem(
        "jarvis_token"
    );

    token = null;

    location.reload();
}


// =========================
// MENSAGENS
// =========================

function adicionarMensagem(tipo, texto) {

    const chat =
        document.getElementById("chat");

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (tipo === "user"
            ? "user-message"
            : "jarvis-message");

    div.textContent = texto;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}


// =========================
// FALAR
// =========================

function falar(texto) {

    if (!("speechSynthesis" in window))
        return;

    window.speechSynthesis.cancel();

    const voz =
        new SpeechSynthesisUtterance(texto);

    voz.lang = "pt-PT";
    voz.rate = 1;
    voz.pitch = 1;

    window.speechSynthesis.speak(voz);
}


// =========================
// STATUS
// =========================

function status(texto) {

    document
        .getElementById("status")
        .textContent = texto;
}


// =========================
// ENVIAR
// =========================

async function enviar() {

    const input =
        document.getElementById("userInput");

    const texto =
        input.value.trim();

    if (!texto)
        return;

    if (!token) {

        alert(
            "Tens de iniciar sessão primeiro."
        );

        return;
    }

    adicionarMensagem(
        "user",
        texto
    );

    input.value = "";

    const respostaLocal =
        comandoLocal(texto);

    if (respostaLocal !== null) {

        adicionarMensagem(
            "jarvis",
            respostaLocal
        );

        falar(respostaLocal);

        return;
    }

    historico.push({
        role: "user",
        content: texto
    });

    status(
        "JARVIS está a pensar..."
    );

    try {

        const response =
            await fetch(
                WORKER_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        messages: historico
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            if (response.status === 401) {

                localStorage.removeItem(
                    "jarvis_token"
                );

                alert(
                    "A tua sessão expirou. Faz login novamente."
                );

                location.reload();

                return;
            }

            throw new Error(
                data.erro ||
                "Erro desconhecido"
            );
        }

        const resposta =
            data.resposta ||
            "Não recebi uma resposta.";

        historico.push({
            role: "assistant",
            content: resposta
        });

        adicionarMensagem(
            "jarvis",
            resposta
        );

        falar(resposta);

        status(
            "JARVIS online"
        );

    } catch (erro) {

        console.error(erro);

        adicionarMensagem(
            "jarvis",
            "Não consegui contactar a IA. " +
            "Verifica o Worker e o Workers AI."
        );

        status(
            "Erro de ligação"
        );
    }
}


// =========================
// COMANDOS LOCAIS
// =========================

function comandoLocal(texto) {

    const t =
        texto.toLowerCase();

    if (
        t.includes("olá") ||
        t.includes("ola") ||
        t.includes("bom dia") ||
        t.includes("boa tarde") ||
        t.includes("boa noite")
    ) {

        return "Olá! Estou pronto para ajudar.";
    }

    if (
        t.includes("que horas") ||
        t === "hora"
    ) {

        return "São " +
            new Date().toLocaleTimeString(
                "pt-PT",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ) + ".";
    }

    if (
        t.includes("que dia") ||
        t.includes("data de hoje")
    ) {

        return "Hoje é " +
            new Date().toLocaleDateString(
                "pt-PT",
                {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            ) + ".";
    }

    if (t.includes("piada")) {

        const piadas = [
            "Porque é que o computador foi ao médico? Porque tinha um vírus!",
            "O que diz um programador quando está com fome? Preciso de mais bytes!",
            "Porque é que o computador estava frio? Porque deixou o Windows aberto!"
        ];

        return piadas[
            Math.floor(
                Math.random() *
                piadas.length
            )
        ];
    }

    if (
        t === "ajuda" ||
        t.includes("o que podes fazer")
    ) {

        return "Posso conversar contigo, responder a perguntas, dizer a hora e a data, contar piadas e muito mais.";
    }

    return null;
}


// =========================
// COMANDO RÁPIDO
// =========================

function comandoRapido(texto) {

    document
        .getElementById("userInput")
        .value = texto;

    enviar();
}


// =========================
// ENTER
// =========================

document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                enviar();
            }
        }
    );


// =========================
// MICROFONE
// =========================

function ouvir() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "O teu navegador não suporta reconhecimento de voz."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "pt-PT";
    recognition.interimResults = false;
    recognition.continuous = false;

    status(
        "A ouvir..."
    );

    recognition.start();

    recognition.onresult =
        function(event) {

            const texto =
                event.results[0][0].transcript;

            document
                .getElementById("userInput")
                .value = texto;

            enviar();
        };

    recognition.onerror =
        function() {

            status(
                "Não consegui ouvir."
            );
        };

    recognition.onend =
        function() {

            setTimeout(() => {
                status("JARVIS online");
            }, 1000);
        };
}


// =========================
// VERIFICAR SESSÃO
// =========================

async function verificarSessao() {

    if (!token)
        return;

    try {

        const response =
            await fetch(
                WORKER_URL + "/me",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );

        const data =
            await response.json();

        if (
            response.ok &&
            data.autenticado
        ) {

            mostrarAplicacao(
                data.username
            );

        } else {

            localStorage.removeItem(
                "jarvis_token"
            );

            token = null;
        }

    } catch (erro) {

        console.error(
            "Erro ao verificar sessão:",
            erro
        );
    }
}


// Iniciar
verificarSessao();

</script>

</body>
</html>
```
