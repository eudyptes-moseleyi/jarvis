<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #05070d;
    color: white;
    min-height: 100vh;
}

/* LOGIN */

#authScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.authBox {
    width: 100%;
    max-width: 420px;
    background: #101522;
    border: 1px solid #26334d;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0,180,255,.15);
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    color: #00c8ff;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #8995aa;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 1px solid #303d55;
    border-radius: 10px;
    background: #080c14;
    color: white;
    outline: none;
    font-size: 16px;
}

input:focus {
    border-color: #00c8ff;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    background: #00aeea;
    color: white;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

button:hover {
    background: #008fca;
}

.authButton {
    width: 100%;
    margin-top: 15px;
}

.switchButton {
    width: 100%;
    margin-top: 10px;
    background: #202a3b;
}

#errorMessage {
    color: #ff6b6b;
    text-align: center;
    margin-top: 15px;
    min-height: 20px;
}

/* APP */

#appScreen {
    display: none;
    min-height: 100vh;
}

.header {
    height: 70px;
    background: #0b101b;
    border-bottom: 1px solid #202b40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.headerLeft {
    display: flex;
    align-items: center;
    gap: 12px;
}

.headerLogo {
    color: #00c8ff;
    font-size: 25px;
    font-weight: bold;
}

.username {
    color: #8995aa;
}

.headerButtons {
    display: flex;
    gap: 8px;
}

.memoryButton {
    background: #303a50;
}

.logoutButton {
    background: #8f2633;
}

/* CHAT */

.main {
    height: calc(100vh - 70px);
    display: flex;
}

.chatArea {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 800px;
    margin: 0 auto 18px auto;
    padding: 15px 18px;
    border-radius: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.userMessage {
    background: #123149;
    margin-left: auto;
}

.jarvisMessage {
    background: #111927;
    border: 1px solid #202c40;
}

.messageName {
    font-size: 12px;
    color: #00c8ff;
    font-weight: bold;
    margin-bottom: 5px;
}

.inputArea {
    padding: 15px;
    border-top: 1px solid #202b40;
    background: #0b101b;
}

.inputBox {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 8px;
}

#messageInput {
    margin: 0;
    flex: 1;
}

.sendButton {
    min-width: 90px;
}

.micButton {
    background: #303a50;
}

/* MEMÓRIA */

#memoryPanel {
    position: fixed;
    top: 0;
    right: -430px;
    width: 420px;
    max-width: 95vw;
    height: 100vh;
    background: #0d1320;
    border-left: 1px solid #26334d;
    z-index: 1000;
    transition: right .3s ease;
    box-shadow: -10px 0 40px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
}

#memoryPanel.open {
    right: 0;
}

#memoryOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 999;
}

#memoryOverlay.open {
    display: block;
}

.memoryHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid #26334d;
}

.memoryTitle {
    font-size: 22px;
    font-weight: bold;
    color: #00c8ff;
}

.memoryInfo {
    padding: 15px 20px;
    color: #8995aa;
    font-size: 14px;
}

.memoryList {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.memoryItem {
    background: #141c2b;
    border: 1px solid #26334d;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
}

.memoryText {
    line-height: 1.4;
}

.memoryDate {
    color: #68758a;
    font-size: 11px;
    margin-top: 8px;
}

.deleteMemory {
    margin-top: 10px;
    background: #812734;
    padding: 7px 10px;
    font-size: 12px;
}

.emptyMemory {
    text-align: center;
    color: #68758a;
    padding: 40px 20px;
}

/* MOBILE */

@media (max-width:600px) {

    .header {
        padding: 0 10px;
    }

    .headerLogo {
        font-size: 20px;
    }

    .username {
        display: none;
    }

    .headerButtons button {
        padding: 9px 10px;
        font-size: 12px;
    }

    .messages {
        padding: 12px;
    }

    .message {
        font-size: 15px;
    }

    .inputBox {
        gap: 5px;
    }

    .sendButton {
        min-width: 65px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="authScreen">

    <div class="authBox">

        <div class="logo">JARVIS</div>

        <div class="subtitle" id="authSubtitle">
            Entra na tua conta
        </div>

        <input
            id="usernameInput"
            type="text"
            placeholder="Nome de utilizador"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Palavra-passe"
        >

        <button
            class="authButton"
            id="authButton"
            onclick="authAction()"
        >
            Entrar
        </button>

        <button
            class="switchButton"
            id="switchButton"
            onclick="switchAuthMode()"
        >
            Criar conta
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- APP -->

<div id="appScreen">

    <div class="header">

        <div class="headerLeft">

            <div class="headerLogo">
                JARVIS
            </div>

            <div
                class="username"
                id="loggedUsername"
            ></div>

        </div>

        <div class="headerButtons">

            <button
                class="memoryButton"
                onclick="openMemoryPanel()"
            >
                🧠 Memória
            </button>

            <button
                class="logoutButton"
                onclick="logout()"
            >
                Sair
            </button>

        </div>

    </div>


    <div class="main">

        <div class="chatArea">

            <div
                class="messages"
                id="messages"
            >

                <div class="message jarvisMessage">

                    <div class="messageName">
                        JARVIS
                    </div>

                    Olá! Sou o JARVIS. Como posso ajudar?

                </div>

            </div>


            <div class="inputArea">

                <div class="inputBox">

                    <button
                        class="micButton"
                        onclick="startVoice()"
                    >
                        🎤
                    </button>

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Fala com o JARVIS..."
                        onkeydown="handleEnter(event)"
                    >

                    <button
                        class="sendButton"
                        onclick="sendMessage()"
                    >
                        Enviar
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- MEMÓRIA -->

<div
    id="memoryOverlay"
    onclick="closeMemoryPanel()"
></div>

<div id="memoryPanel">

    <div class="memoryHeader">

        <div class="memoryTitle">
            🧠 Memórias
        </div>

        <button onclick="closeMemoryPanel()">
            ✕
        </button>

    </div>

    <div class="memoryInfo">

        O JARVIS guarda automaticamente informações
        importantes que aprende sobre ti.

    </div>

    <div
        class="memoryList"
        id="memoryList"
    >

        <div class="emptyMemory">
            A carregar...
        </div>

    </div>

</div>


<script>

const WORKER_URL =
    "https://jarvis.2024guiteles.workers.dev";

let token =
    localStorage.getItem("jarvis_token");

let currentUsername = "";

let authMode = "login";

let conversation = [];


/* ELEMENTOS */

const authScreen =
    document.getElementById("authScreen");

const appScreen =
    document.getElementById("appScreen");

const usernameInput =
    document.getElementById("usernameInput");

const passwordInput =
    document.getElementById("passwordInput");

const authButton =
    document.getElementById("authButton");

const switchButton =
    document.getElementById("switchButton");

const authSubtitle =
    document.getElementById("authSubtitle");

const errorMessage =
    document.getElementById("errorMessage");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const loggedUsername =
    document.getElementById("loggedUsername");

const memoryPanel =
    document.getElementById("memoryPanel");

const memoryOverlay =
    document.getElementById("memoryOverlay");

const memoryList =
    document.getElementById("memoryList");


/* LOGIN / REGISTO */

function switchAuthMode() {

    if (authMode === "login") {

        authMode = "register";

        authSubtitle.textContent =
            "Cria a tua conta JARVIS";

        authButton.textContent =
            "Criar conta";

        switchButton.textContent =
            "Já tenho uma conta";

    } else {

        authMode = "login";

        authSubtitle.textContent =
            "Entra na tua conta";

        authButton.textContent =
            "Entrar";

        switchButton.textContent =
            "Criar conta";
    }

    errorMessage.textContent = "";
}


async function authAction() {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    errorMessage.textContent = "";

    if (!username || !password) {

        errorMessage.textContent =
            "Preenche todos os campos.";

        return;
    }

    authButton.disabled = true;

    try {

        const endpoint =
            authMode === "login"
                ? "/login"
                : "/register";

        const response =
            await fetch(
                WORKER_URL + endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro no servidor."
            );
        }

        if (authMode === "register") {

            alert(
                "Conta criada com sucesso!"
            );

            authMode = "login";

            authSubtitle.textContent =
                "Entra na tua conta";

            authButton.textContent =
                "Entrar";

            switchButton.textContent =
                "Criar conta";

            passwordInput.value = "";

            return;
        }

        token = data.token;

        currentUsername =
            data.username;

        localStorage.setItem(
            "jarvis_token",
            token
        );

        showApp();

    } catch (error) {

        errorMessage.textContent =
            error.message;

    } finally {

        authButton.disabled = false;
    }
}


/* VERIFICAR LOGIN */

async function checkLogin() {

    if (!token) {

        showAuth();

        return;
    }

    try {

        const response =
            await fetch(
                WORKER_URL + "/me",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token
                    })
                }
            );

        const data =
            await response.json();

        if (!data.autenticado) {

            localStorage.removeItem(
                "jarvis_token"
            );

            token = null;

            showAuth();

            return;
        }

        currentUsername =
            data.username;

        showApp();

    } catch (error) {

        showAuth();
    }
}


/* APP */

function showApp() {

    authScreen.style.display =
        "none";

    appScreen.style.display =
        "block";

    loggedUsername.textContent =
        "Olá, " + currentUsername;

    messageInput.focus();
}


function showAuth() {

    authScreen.style.display =
        "flex";

    appScreen.style.display =
        "none";
}


/* LOGOUT */

async function logout() {

    try {

        await fetch(
            WORKER_URL + "/logout",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    token
                })
            }
        );

    } catch (e) {}

    localStorage.removeItem(
        "jarvis_token"
    );

    token = null;

    conversation = [];

    showAuth();
}


/* CHAT */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;

    messageInput.value = "";

    addMessage(
        "user",
        text
    );

    conversation.push({
        role: "user",
        content: text
    });

    const loading =
        addMessage(
            "jarvis",
            "A pensar..."
        );

    try {

        const response =
            await fetch(
                WORKER_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token,
                        messages:
                            conversation
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro no servidor."
            );
        }

        loading.remove();

        const answer =
            data.resposta ||
            "Não recebi uma resposta.";

        addMessage(
            "jarvis",
            answer
        );

        conversation.push({
            role: "assistant",
            content: answer
        });

        speak(answer);

    } catch (error) {

        loading.remove();

        addMessage(
            "jarvis",
            "Erro: " + error.message
        );
    }
}


/* MENSAGENS */

function addMessage(type, text) {

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            type === "user"
                ? "userMessage"
                : "jarvisMessage"
        );

    const name =
        document.createElement("div");

    name.className =
        "messageName";

    name.textContent =
        type === "user"
            ? "TU"
            : "JARVIS";

    const content =
        document.createElement("div");

    content.textContent =
        text;

    div.appendChild(name);

    div.appendChild(content);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

    return div;
}


function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


/* VOZ */

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "pt-PT";

    voice.rate = 1;

    speechSynthesis.speak(voice);
}


/* MICROFONE */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {

        alert(
            "O navegador não suporta reconhecimento de voz."
        );

        return;
    }

    const recognition =
        new Recognition();

    recognition.lang =
        "pt-PT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.start();

    recognition.onresult =
        function(event) {

            messageInput.value =
                event.results[0][0]
                    .transcript;

            sendMessage();
        };
}


/* ABRIR MEMÓRIA */

function openMemoryPanel() {

    memoryPanel.classList.add("open");

    memoryOverlay.classList.add("open");

    loadMemories();
}


/* FECHAR MEMÓRIA */

function closeMemoryPanel() {

    memoryPanel.classList.remove("open");

    memoryOverlay.classList.remove("open");
}


/* CARREGAR MEMÓRIAS */

async function loadMemories() {

    memoryList.innerHTML =
        `<div class="emptyMemory">
            A carregar memórias...
        </div>`;

    try {

        const response =
            await fetch(
                WORKER_URL + "/memories",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao carregar memórias."
            );
        }

        renderMemories(
            data.memorias || []
        );

    } catch (error) {

        memoryList.innerHTML =
            `<div class="emptyMemory">
                Erro:<br><br>
                ${escapeHTML(error.message)}
            </div>`;
    }
}


/* MOSTRAR MEMÓRIAS */

function renderMemories(memories) {

    if (memories.length === 0) {

        memoryList.innerHTML =
            `<div class="emptyMemory">
                🧠<br><br>
                Ainda não tenho memórias sobre ti.
                <br><br>
                Continua a conversar comigo.
            </div>`;

        return;
    }

    memoryList.innerHTML = "";

    memories.forEach(memory => {

        const item =
            document.createElement("div");

        item.className =
            "memoryItem";

        const text =
            document.createElement("div");

        text.className =
            "memoryText";

        text.textContent =
            memory.memory;

        const date =
            document.createElement("div");

        date.className =
            "memoryDate";

        date.textContent =
            memory.created_at
                ? "Guardada em " +
                  memory.created_at
                : "";

        const button =
            document.createElement("button");

        button.className =
            "deleteMemory";

        button.textContent =
            "🗑️ Esquecer";

        button.onclick =
            function() {

                deleteMemory(
                    memory.id
                );
            };

        item.appendChild(text);

        item.appendChild(date);

        item.appendChild(button);

        memoryList.appendChild(item);
    });
}


/* APAGAR MEMÓRIA */

async function deleteMemory(id) {

    try {

        const response =
            await fetch(
                WORKER_URL + "/forget",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token,
                        id
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao apagar."
            );
        }

        loadMemories();

    } catch (error) {

        alert(
            "Erro: " +
            error.message
        );
    }
}


/* SEGURANÇA */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* INICIAR */

checkLogin();

</script>

</body>
</html>
