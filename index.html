<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background:
        radial-gradient(circle at center, #082b35 0%, #02070a 45%, #000 100%);
    color: #00f6ff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

/* =====================================================
   FUNDO
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.04) 1px, transparent 1px);

    background-size: 40px 40px;

    pointer-events: none;
}

/* =====================================================
   LOGIN
===================================================== */

#loginScreen {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle, #06313b 0%, #020607 50%, #000 100%);

    z-index: 1000;
}

.loginBox {
    width: min(420px, 90%);
    padding: 35px;

    border: 1px solid #00eaff;
    border-radius: 20px;

    background: rgba(0, 20, 25, .88);

    box-shadow:
        0 0 20px #00eaff,
        inset 0 0 30px rgba(0,255,255,.05);

    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 8px;

    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff;

    margin-bottom: 10px;
}

.subtitle {
    color: #7defff;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 7px 0;

    border: 1px solid #00d9ff;
    border-radius: 8px;

    background: rgba(0,0,0,.5);
    color: white;

    outline: none;
}

input:focus {
    box-shadow: 0 0 15px #00eaff;
}

button {
    border: 1px solid #00eaff;
    background: rgba(0, 40, 50, .7);
    color: #00f6ff;

    padding: 11px 18px;
    border-radius: 8px;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    background: #00eaff;
    color: #001014;

    box-shadow: 0 0 20px #00eaff;
}

.loginButtons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.loginButtons button {
    flex: 1;
}

#loginMessage {
    margin-top: 15px;
    color: #ff6677;
    min-height: 20px;
}

/* =====================================================
   APP
===================================================== */

#app {
    display: none;
    min-height: 100vh;
}

/* =====================================================
   TOPO
===================================================== */

.topbar {
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    border-bottom: 1px solid rgba(0,255,255,.3);

    background: rgba(0,10,14,.75);

    backdrop-filter: blur(10px);
}

.topTitle {
    font-size: 20px;
    letter-spacing: 5px;

    text-shadow: 0 0 10px #00eaff;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 12px;
}

.statusDot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #00ff99;

    box-shadow: 0 0 12px #00ff99;
}

/* =====================================================
   LAYOUT
===================================================== */

.main {
    height: calc(100vh - 65px);

    display: grid;
    grid-template-columns: 1fr 430px 1fr;

    gap: 20px;

    padding: 20px;
}

/* =====================================================
   PAINÉIS
===================================================== */

.panel {
    border: 1px solid rgba(0,255,255,.3);
    border-radius: 18px;

    background: rgba(0,15,20,.65);

    box-shadow:
        inset 0 0 30px rgba(0,255,255,.03),
        0 0 20px rgba(0,255,255,.04);

    overflow: hidden;
}

.panelHeader {
    padding: 15px;

    border-bottom: 1px solid rgba(0,255,255,.2);

    letter-spacing: 2px;
    font-size: 13px;
}

/* =====================================================
   CHAT
===================================================== */

.chatPanel {
    display: flex;
    flex-direction: column;
}

#chat {
    flex: 1;

    overflow-y: auto;

    padding: 15px;
}

.message {
    margin-bottom: 15px;
    padding: 12px;

    border-radius: 10px;

    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    background: rgba(0,170,220,.12);
    border-left: 3px solid #00eaff;
}

.jarvis {
    background: rgba(0,255,180,.08);
    border-left: 3px solid #00ff99;
}

.chatInput {
    display: flex;
    gap: 8px;

    padding: 12px;

    border-top: 1px solid rgba(0,255,255,.2);
}

#messageInput {
    margin: 0;
}

.sendButton {
    min-width: 70px;
}

/* =====================================================
   CORE JARVIS
===================================================== */

.center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.coreArea {
    position: relative;

    width: 300px;
    height: 300px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.core {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    background:
        radial-gradient(circle, white 0%, #00f6ff 15%, #007c91 45%, transparent 70%);

    box-shadow:
        0 0 20px #00eaff,
        0 0 60px #00eaff,
        0 0 120px rgba(0,255,255,.6);

    animation: pulse 2s infinite;
}

.ring {
    position: absolute;

    border: 2px solid rgba(0,238,255,.6);

    border-radius: 50%;
}

.ring1 {
    width: 160px;
    height: 160px;

    animation: rotate 7s linear infinite;
}

.ring2 {
    width: 220px;
    height: 220px;

    border-style: dashed;

    animation: rotateReverse 12s linear infinite;
}

.ring3 {
    width: 280px;
    height: 280px;

    border-color: rgba(0,255,180,.25);

    animation: rotate 20s linear infinite;
}

@keyframes pulse {

    0%,100% {
        transform: scale(.9);
        opacity: .8;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }
}

@keyframes rotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

.coreText {
    margin-top: 20px;

    text-align: center;

    letter-spacing: 4px;
}

#systemStatus {
    margin-top: 8px;

    font-size: 12px;

    color: #74faff;
}

/* =====================================================
   CONTROLOS
===================================================== */

.controls {
    display: flex;
    gap: 10px;
    margin-top: 30px;
}

.controls button {
    min-width: 80px;
}

/* =====================================================
   MEMÓRIA
===================================================== */

.memoryPanel {
    display: flex;
    flex-direction: column;
}

#memoryList {
    flex: 1;

    overflow-y: auto;

    padding: 15px;
}

.memoryItem {
    display: flex;

    justify-content: space-between;
    gap: 10px;

    padding: 12px;

    margin-bottom: 10px;

    border: 1px solid rgba(0,255,255,.18);

    border-radius: 10px;

    background: rgba(0,255,255,.03);
}

.memoryText {
    font-size: 13px;
    line-height: 1.4;
}

.deleteMemory {
    padding: 5px 9px;

    color: #ff6680;
    border-color: #ff6680;

    flex-shrink: 0;
}

/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: #02080b;
}

::-webkit-scrollbar-thumb {
    background: #007f91;
    border-radius: 10px;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 1000px) {

    body {
        overflow: auto;
    }

    .main {
        height: auto;

        grid-template-columns: 1fr;

        padding: 12px;
    }

    .center {
        min-height: 420px;
        order: -1;
    }

    .chatPanel {
        height: 500px;
    }

    .memoryPanel {
        height: 400px;
    }

    .topbar {
        padding: 0 12px;
    }

    .topTitle {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<!-- ===================================================
     LOGIN
=================================================== -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            JARVIS
        </div>

        <div class="subtitle">
            PERSONAL ARTIFICIAL INTELLIGENCE
        </div>

        <input
            id="username"
            type="text"
            placeholder="Utilizador"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <div class="loginButtons">

            <button onclick="login()">
                ENTRAR
            </button>

            <button onclick="register()">
                REGISTAR
            </button>

        </div>

        <div id="loginMessage"></div>

    </div>

</div>

<!-- ===================================================
     APP
=================================================== -->

<div id="app">

    <div class="topbar">

        <div class="topTitle">
            JARVIS
        </div>

        <div class="status">

            <div class="statusDot"></div>

            <span id="topStatus">
                ONLINE
            </span>

            <button onclick="logout()">
                SAIR
            </button>

        </div>

    </div>

    <div class="main">

        <!-- CHAT -->

        <div class="panel chatPanel">

            <div class="panelHeader">
                CONVERSAÇÃO
            </div>

            <div id="chat"></div>

            <div class="chatInput">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Fale com o JARVIS..."
                    autocomplete="off"
                >

                <button
                    class="sendButton"
                    onclick="sendMessage()"
                >
                    ENVIAR
                </button>

            </div>

        </div>

        <!-- CORE -->

        <div class="center">

            <div class="coreArea">

                <div class="ring ring3"></div>
                <div class="ring ring2"></div>
                <div class="ring ring1"></div>

                <div class="core"></div>

            </div>

            <div class="coreText">
                JARVIS
            </div>

            <div id="systemStatus">
                SISTEMA ONLINE
            </div>

            <div class="controls">

                <button onclick="startVoice()">
                    🎤 VOZ
                </button>

                <button onclick="loadMemories()">
                    🧠 MEMÓRIA
                </button>

            </div>

        </div>

        <!-- MEMÓRIA -->

        <div class="panel memoryPanel">

            <div class="panelHeader">
                🧠 MEMÓRIA
            </div>

            <div id="memoryList">
                <div>
                    A carregar memória...
                </div>
            </div>

        </div>

    </div>

</div>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const WORKER_URL =
    "https://jarvis.2024guiteles.workers.dev";

/*
    IMPORTANTE:
    O token fica guardado no navegador.
*/

let token =
    localStorage.getItem("jarvis_token");

let username =
    localStorage.getItem("jarvis_username");

let conversation = [];

/* =====================================================
   ELEMENTOS
===================================================== */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const loginMessage =
    document.getElementById("loginMessage");

const chat =
    document.getElementById("chat");

const messageInput =
    document.getElementById("messageInput");

const memoryList =
    document.getElementById("memoryList");

const systemStatus =
    document.getElementById("systemStatus");

const topStatus =
    document.getElementById("topStatus");

/* =====================================================
   AUTENTICAÇÃO INICIAL
===================================================== */

async function verificarLogin() {

    if (!token) {

        mostrarLogin();

        return;
    }

    try {

        const resposta =
            await fetch(
                WORKER_URL + "/me",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            localStorage.removeItem(
                "jarvis_token"
            );

            localStorage.removeItem(
                "jarvis_username"
            );

            token = null;

            mostrarLogin();

            return;
        }

        username =
            dados.username;

        mostrarApp();

    } catch (erro) {

        console.error(erro);

        loginMessage.textContent =
            "Não foi possível contactar o JARVIS.";

        mostrarLogin();
    }
}

/* =====================================================
   MOSTRAR LOGIN
===================================================== */

function mostrarLogin() {

    loginScreen.style.display =
        "flex";

    app.style.display =
        "none";
}

/* =====================================================
   MOSTRAR APP
===================================================== */

function mostrarApp() {

    loginScreen.style.display =
        "none";

    app.style.display =
        "block";

    systemStatus.textContent =
        "SISTEMA ONLINE";

    topStatus.textContent =
        username
            ? "ONLINE • " + username
            : "ONLINE";

    adicionarMensagem(
        "jarvis",
        "Olá. Eu sou o JARVIS. Sistema online."
    );

    loadMemories();
}

/* =====================================================
   REGISTAR
===================================================== */

async function register() {

    const user =
        document
            .getElementById("username")
            .value
            .trim();

    const pass =
        document
            .getElementById("password")
            .value;

    if (!user || !pass) {

        loginMessage.textContent =
            "Preenche o utilizador e a password.";

        return;
    }

    loginMessage.textContent =
        "A criar conta...";

    try {

        const resposta =
            await fetch(
                WORKER_URL + "/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: user,
                        password: pass
                    })
                }
            );

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            loginMessage.textContent =
                dados.erro ||
                "Erro ao criar conta.";

            return;
        }

        token =
            dados.token;

        username =
            dados.username;

        localStorage.setItem(
            "jarvis_token",
            token
        );

        localStorage.setItem(
            "jarvis_username",
            username
        );

        mostrarApp();

    } catch (erro) {

        console.error(erro);

        loginMessage.textContent =
            "Erro de ligação ao servidor.";
    }
}

/* =====================================================
   LOGIN
===================================================== */

async function login() {

    const user =
        document
            .getElementById("username")
            .value
            .trim();

    const pass =
        document
            .getElementById("password")
            .value;

    if (!user || !pass) {

        loginMessage.textContent =
            "Preenche o utilizador e a password.";

        return;
    }

    loginMessage.textContent =
        "A entrar...";

    try {

        const resposta =
            await fetch(
                WORKER_URL + "/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: user,
                        password: pass
                    })
                }
            );

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            loginMessage.textContent =
                dados.erro ||
                "Erro ao iniciar sessão.";

            return;
        }

        token =
            dados.token;

        username =
            dados.username;

        localStorage.setItem(
            "jarvis_token",
            token
        );

        localStorage.setItem(
            "jarvis_username",
            username
        );

        mostrarApp();

    } catch (erro) {

        console.error(erro);

        loginMessage.textContent =
            "Erro de ligação ao servidor.";
    }
}

/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    try {

        if (token) {

            await fetch(
                WORKER_URL + "/logout",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    }
                }
            );
        }

    } catch (erro) {

        console.error(erro);
    }

    token = null;
    username = null;

    localStorage.removeItem(
        "jarvis_token"
    );

    localStorage.removeItem(
        "jarvis_username"
    );

    conversation = [];

    chat.innerHTML = "";

    mostrarLogin();
}

/* =====================================================
   MENSAGEM
===================================================== */

function adicionarMensagem(tipo, texto) {

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (tipo === "user"
            ? "user"
            : "jarvis");

    div.textContent =
        texto;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;
}

/* =====================================================
   CHAT
===================================================== */

async function sendMessage() {

    const texto =
        messageInput.value.trim();

    if (!texto) {
        return;
    }

    if (!token) {

        adicionarMensagem(
            "jarvis",
            "Erro: não estás autenticado."
        );

        mostrarLogin();

        return;
    }

    adicionarMensagem(
        "user",
        texto
    );

    messageInput.value = "";

    conversation.push({
        role: "user",
        content: texto
    });

    systemStatus.textContent =
        "A PROCESSAR...";

    topStatus.textContent =
        "PROCESSANDO";

    try {

        const resposta =
            await fetch(
                WORKER_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({
                        messages:
                            conversation
                    })
                }
            );

        const dados =
            await resposta.json();

        if (resposta.status === 401) {

            localStorage.removeItem(
                "jarvis_token"
            );

            localStorage.removeItem(
                "jarvis_username"
            );

            token = null;

            adicionarMensagem(
                "jarvis",
                "A sessão expirou. Faz login novamente."
            );

            mostrarLogin();

            return;
        }

        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                "Erro no servidor."
            );
        }

        const respostaTexto =
            dados.resposta ||
            "Não recebi uma resposta.";

        conversation.push({
            role: "assistant",
            content: respostaTexto
        });

        adicionarMensagem(
            "jarvis",
            respostaTexto
        );

        systemStatus.textContent =
            "SISTEMA ONLINE";

        topStatus.textContent =
            username
                ? "ONLINE • " + username
                : "ONLINE";

        speak(
            respostaTexto
        );

        /*
            Atualiza a memória depois
            de enviar a mensagem.
        */

        setTimeout(
            loadMemories,
            500
        );

    } catch (erro) {

        console.error(erro);

        adicionarMensagem(
            "jarvis",
            "Erro: " + erro.message
        );

        systemStatus.textContent =
            "ERRO DE SISTEMA";

        topStatus.textContent =
            "ERRO";
    }
}

/* =====================================================
   ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    }
);

/* =====================================================
   MEMÓRIAS
===================================================== */

async function loadMemories() {

    if (!token) {

        memoryList.innerHTML =
            "<div>Não autenticado.</div>";

        return;
    }

    memoryList.innerHTML =
        "<div>A carregar memória...</div>";

    try {

        const resposta =
            await fetch(
                WORKER_URL + "/memories",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({})
                }
            );

        const dados =
            await resposta.json();

        if (resposta.status === 401) {

            memoryList.innerHTML =
                "<div>Sessão expirada.</div>";

            return;
        }

        if (!resposta.ok) {

            memoryList.innerHTML =
                "<div>Erro: " +
                (dados.erro || "desconhecido") +
                "</div>";

            return;
        }

        const memorias =
            dados.memorias || [];

        if (memorias.length === 0) {

            memoryList.innerHTML =
                "<div>Ainda não tenho memórias guardadas.</div>";

            return;
        }

        memoryList.innerHTML = "";

        for (const memoria of memorias) {

            const item =
                document.createElement("div");

            item.className =
                "memoryItem";

            const texto =
                document.createElement("div");

            texto.className =
                "memoryText";

            texto.textContent =
                memoria.memory;

            const apagar =
                document.createElement("button");

            apagar.className =
                "deleteMemory";

            apagar.textContent =
                "X";

            apagar.onclick =
                () => apagarMemoria(
                    memoria.id
                );

            item.appendChild(
                texto
            );

            item.appendChild(
                apagar
            );

            memoryList.appendChild(
                item
            );
        }

    } catch (erro) {

        console.error(erro);

        memoryList.innerHTML =
            "<div>Erro ao carregar memória.</div>";
    }
}

/* =====================================================
   APAGAR MEMÓRIA
===================================================== */

async function apagarMemoria(id) {

    if (!token) {
        return;
    }

    try {

        const resposta =
            await fetch(
                WORKER_URL + "/forget",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body: JSON.stringify({
                        id: id
                    })
                }
            );

        const dados =
            await resposta.json();

        if (!resposta.ok) {

            alert(
                dados.erro ||
                "Não foi possível apagar."
            );

            return;
        }

        loadMemories();

    } catch (erro) {

        console.error(erro);

        alert(
            "Erro ao apagar memória."
        );
    }
}

/* =====================================================
   VOZ
===================================================== */

function speak(texto) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const voz =
        new SpeechSynthesisUtterance(
            texto
        );

    voz.lang =
        "pt-PT";

    voz.rate =
        0.95;

    voz.pitch =
        0.9;

    voz.onstart =
        function() {

            systemStatus.textContent =
                "A FALAR...";

            topStatus.textContent =
                "FALAR";
        };

    voz.onend =
        function() {

            systemStatus.textContent =
                "SISTEMA ONLINE";

            topStatus.textContent =
                username
                    ? "ONLINE • " + username
                    : "ONLINE";
        };

    speechSynthesis.speak(
        voz
    );
}

/* =====================================================
   MICROFONE
===================================================== */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {

        alert(
            "O teu navegador não suporta reconhecimento de voz."
        );

        return;
    }

    const recognition =
        new Recognition();

    recognition.lang =
        "pt-PT";

    recognition.interimResults =
        false;

    recognition.continuous =
        false;

    systemStatus.textContent =
        "A OUVIR...";

    topStatus.textContent =
        "A OUVIR";

    recognition.start();

    recognition.onresult =
        function(event) {

            const texto =
                event
                    .results[0][0]
                    .transcript;

            messageInput.value =
                texto;

            sendMessage();
        };

    recognition.onerror =
        function(event) {

            console.error(
                event.error
            );

            systemStatus.textContent =
                "SISTEMA ONLINE";

            topStatus.textContent =
                username
                    ? "ONLINE • " + username
                    : "ONLINE";
        };

    recognition.onend =
        function() {

            systemStatus.textContent =
                "SISTEMA ONLINE";

            topStatus.textContent =
                username
                    ? "ONLINE • " + username
                    : "ONLINE";
        };
}
