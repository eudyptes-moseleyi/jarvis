<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --cyan: #00d9ff;
    --cyan2: #008cff;
    --dark: #02070b;
    --panel: rgba(5, 16, 24, 0.88);
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #02070b;
    color: white;
}

/* =====================================================
   FUNDO FUTURISTA
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,217,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,217,255,0.035) 1px, transparent 1px);
    background-size: 45px 45px;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center, rgba(0,180,255,0.12), transparent 35%),
        linear-gradient(180deg, transparent 70%, rgba(0,0,0,0.7));
    pointer-events: none;
}

/* =====================================================
   LOGIN
===================================================== */

#authScreen {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 5;
}

.auth-box {
    width: 90%;
    max-width: 420px;
    padding: 35px;
    background: rgba(3, 12, 18, 0.94);
    border: 1px solid var(--cyan);
    box-shadow:
        0 0 15px rgba(0,217,255,0.35),
        inset 0 0 30px rgba(0,150,255,0.05);
    clip-path: polygon(
        0 18px,
        18px 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% calc(100% - 18px),
        calc(100% - 18px) 100%,
        18px 100%,
        0 calc(100% - 18px)
    );
}

.logo {
    text-align: center;
    color: var(--cyan);
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 8px;
    text-shadow: 0 0 20px var(--cyan);
}

.subtitle {
    text-align: center;
    color: #718894;
    margin: 8px 0 30px;
}

.auth-box input {
    width: 100%;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid #194454;
    background: #02080c;
    color: white;
    outline: none;
    font-size: 15px;
}

.auth-box input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,217,255,0.2);
}

.auth-box button {
    width: 100%;
    padding: 14px;
    margin-top: 7px;
    border: 1px solid var(--cyan);
    background: rgba(0,150,220,0.15);
    color: var(--cyan);
    font-weight: bold;
    cursor: pointer;
}

.auth-box button:hover {
    background: rgba(0,217,255,0.25);
    box-shadow: 0 0 15px rgba(0,217,255,0.25);
}

#switchButton {
    border-color: #34505c;
    color: #829aa5;
    background: rgba(20,30,35,0.7);
}

#errorMessage {
    color: #ff5964;
    text-align: center;
    margin-top: 15px;
}

/* =====================================================
   APP
===================================================== */

#appScreen {
    display: none;
    height: 100vh;
    position: relative;
    z-index: 2;
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;

    background: rgba(2,9,14,0.88);
    border-bottom: 1px solid #123d4b;

    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.topbar-title {
    color: var(--cyan);
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 0 12px var(--cyan);
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

#loggedUsername {
    color: #66808c;
}

.topbar button {
    border: 1px solid #1c4655;
    background: rgba(10,25,33,0.9);
    color: #a9dce9;
    padding: 9px 12px;
    cursor: pointer;
}

.topbar button:hover {
    border-color: var(--cyan);
    color: white;
    box-shadow: 0 0 10px rgba(0,217,255,0.15);
}

#logoutButton {
    border-color: #662d35;
    color: #ff7180;
}

/* =====================================================
   MAIN
===================================================== */

.chat {
    height: calc(100vh - 65px);
    display: flex;
    flex-direction: column;
    position: relative;
}

/* =====================================================
   NÚCLEO JARVIS
===================================================== */

.jarvis-core {
    height: 230px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.core {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    position: relative;

    border: 2px solid var(--cyan);

    box-shadow:
        0 0 10px var(--cyan),
        0 0 35px rgba(0,217,255,0.7),
        inset 0 0 25px rgba(0,217,255,0.4);

    animation: corePulse 2.5s infinite;
}

.core::before {
    content: "";
    position: absolute;
    inset: 13px;
    border-radius: 50%;
    border: 2px dashed var(--cyan);
    animation: rotate 5s linear infinite;
}

.core::after {
    content: "";
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow:
        0 0 15px var(--cyan),
        0 0 35px var(--cyan),
        0 0 65px var(--cyan);
}

.core-ring {
    position: absolute;
    width: 155px;
    height: 155px;
    border-radius: 50%;
    border: 1px solid rgba(0,217,255,0.4);
    border-top-color: transparent;
    border-bottom-color: transparent;
    animation: rotateReverse 8s linear infinite;
}

.core-ring2 {
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    border: 1px solid rgba(0,217,255,0.2);
    border-left-color: transparent;
    border-right-color: transparent;
    animation: rotate 12s linear infinite;
}

.core-status {
    position: absolute;
    top: calc(50% + 90px);
    color: var(--cyan);
    font-size: 11px;
    letter-spacing: 4px;
    text-shadow: 0 0 10px var(--cyan);
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

@keyframes rotateReverse {
    to {
        transform: rotate(-360deg);
    }
}

@keyframes corePulse {
    0%, 100% {
        transform: scale(1);
        box-shadow:
            0 0 10px var(--cyan),
            0 0 35px rgba(0,217,255,0.5);
    }

    50% {
        transform: scale(1.08);
        box-shadow:
            0 0 20px var(--cyan),
            0 0 60px rgba(0,217,255,0.8);
    }
}

/* =====================================================
   STATUS
===================================================== */

.status-line {
    text-align: center;
    height: 25px;
    color: #55717d;
    font-size: 11px;
    letter-spacing: 2px;
}

.status-line.active {
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
}

/* =====================================================
   MENSAGENS
===================================================== */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 20px 20px;
    scroll-behavior: smooth;
}

#messages::-webkit-scrollbar {
    width: 5px;
}

#messages::-webkit-scrollbar-thumb {
    background: #145166;
}

.message {
    max-width: 800px;
    margin: 0 auto 12px;
    padding: 13px 16px;
    line-height: 1.5;
    white-space: pre-wrap;

    border-left: 2px solid var(--cyan);
    background: rgba(5,16,23,0.82);

    animation: messageIn 0.25s ease;
}

.user {
    border-left-color: #596d77;
    background: rgba(20,30,36,0.8);
}

.message-name {
    color: var(--cyan);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 5px;
}

.user .message-name {
    color: #80939c;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =====================================================
   INPUT
===================================================== */

.input-area {
    padding: 12px;
    background: rgba(2,9,14,0.94);
    border-top: 1px solid #123d4b;
}

.input-container {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 7px;
}

#messageInput {
    flex: 1;
    padding: 14px;
    background: #030b10;
    color: white;
    border: 1px solid #194454;
    outline: none;
    font-size: 15px;
}

#messageInput:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0,217,255,0.12);
}

.input-container button {
    border: 1px solid var(--cyan);
    background: rgba(0,150,220,0.18);
    color: var(--cyan);
    padding: 10px 16px;
    cursor: pointer;
    font-weight: bold;
}

.input-container button:hover {
    background: rgba(0,217,255,0.25);
}

#micButton.listening {
    color: white;
    background: rgba(0,217,255,0.35);
    box-shadow: 0 0 20px rgba(0,217,255,0.4);
}

/* =====================================================
   MEMÓRIA
===================================================== */

#memoryOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
}

#memoryOverlay.show {
    display: block;
}

#memoryPanel {
    position: fixed;
    top: 0;
    right: -400px;

    width: 380px;
    max-width: 90%;
    height: 100vh;

    background: rgba(3,12,18,0.98);
    border-left: 1px solid var(--cyan);

    z-index: 100;

    transition: right 0.3s ease;

    display: flex;
    flex-direction: column;

    box-shadow: -10px 0 35px rgba(0,217,255,0.12);
}

#memoryPanel.show {
    right: 0;
}

.memory-header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    border-bottom: 1px solid #164353;
}

.memory-header h2 {
    margin: 0;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
}

.memory-header button {
    border: 1px solid #31505b;
    background: #09161d;
    color: white;
    padding: 8px 12px;
    cursor: pointer;
}

.memory-description {
    padding: 15px;
    color: #718894;
    font-size: 13px;
    border-bottom: 1px solid #152d37;
}

#memoryList {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
}

.memory {
    padding: 12px;
    margin-bottom: 10px;
    background: rgba(10,25,33,0.8);
    border: 1px solid #1b4351;
}

.memory-text {
    line-height: 1.4;
}

.memory-date {
    color: #58717c;
    font-size: 11px;
    margin-top: 7px;
}

.memory-delete {
    margin-top: 9px;
    border: 1px solid #652c35;
    background: #30171b;
    color: #ff7b86;
    padding: 6px 9px;
    cursor: pointer;
}

.no-memory {
    text-align: center;
    color: #58717c;
    padding: 30px 10px;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {
        padding: 0 10px;
    }

    .topbar-title {
        font-size: 19px;
        letter-spacing: 3px;
    }

    #loggedUsername {
        display: none;
    }

    .topbar button {
        padding: 8px;
        font-size: 11px;
    }

    .jarvis-core {
        height: 190px;
    }

    .core {
        width: 80px;
        height: 80px;
    }

    .core-ring {
        width: 120px;
        height: 120px;
    }

    .core-ring2 {
        width: 150px;
        height: 150px;
    }

    .core-status {
        top: calc(50% + 72px);
        font-size: 9px;
    }

    #messages {
        padding: 5px 10px 15px;
    }

    .message {
        font-size: 14px;
    }

    .input-container button {
        padding: 10px;
    }

    #memoryPanel {
        width: 340px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="authScreen">

    <div class="auth-box">

        <div class="logo">JARVIS</div>

        <div class="subtitle" id="authSubtitle">
            Entra na tua conta
        </div>

        <input
            id="usernameInput"
            type="text"
            placeholder="Nome de utilizador"
        >

        <input
            id="passwordInput"
            type="password"
            placeholder="Palavra-passe"
        >

        <button id="authButton" onclick="authAction()">
            Entrar
        </button>

        <button id="switchButton" onclick="switchAuthMode()">
            Criar conta
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="appScreen">

    <div class="topbar">

        <div class="topbar-title">
            JARVIS
        </div>

        <div class="topbar-right">

            <span id="loggedUsername"></span>

            <button onclick="openMemoryPanel()">
                🧠 Memória
            </button>

            <button id="logoutButton" onclick="logout()">
                Sair
            </button>

        </div>

    </div>


    <div class="chat">

        <!-- NÚCLEO -->

        <div class="jarvis-core">

            <div class="core-ring"></div>
            <div class="core-ring2"></div>
            <div class="core"></div>

            <div id="coreStatus" class="core-status">
                JARVIS ONLINE
            </div>

        </div>

        <div id="statusLine" class="status-line">
            SISTEMA OPERACIONAL
        </div>


        <!-- MENSAGENS -->

        <div id="messages">

            <div class="message jarvis">

                <div class="message-name">
                    JARVIS
                </div>

                Olá. Sou o JARVIS. Sistemas online.
                Como posso ajudar?

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-container">

                <button
                    id="micButton"
                    onclick="startVoice()"
                    title="Falar com JARVIS"
                >
                    🎤
                </button>

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Fala com o JARVIS..."
                    onkeydown="handleEnter(event)"
                >

                <button onclick="sendMessage()">
                    ENVIAR
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     MEMÓRIA
===================================================== -->

<div
    id="memoryOverlay"
    onclick="closeMemoryPanel()"
></div>

<div id="memoryPanel">

    <div class="memory-header">

        <h2>🧠 Memória</h2>

        <button onclick="closeMemoryPanel()">
            ✕
        </button>

    </div>

    <div class="memory-description">
        O JARVIS guarda automaticamente informações
        importantes que aprende durante as conversas.
    </div>

    <div id="memoryList">

        <div class="no-memory">
            A carregar memórias...
        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const WORKER_URL =
    "https://jarvis.2024guiteles.workers.dev";

let token =
    localStorage.getItem("jarvis_token");

let currentUsername = "";

let authMode = "login";

let conversation = [];


/* =====================================================
   ELEMENTOS
===================================================== */

const authScreen =
    document.getElementById("authScreen");

const appScreen =
    document.getElementById("appScreen");

const usernameInput =
    document.getElementById("usernameInput");

const passwordInput =
    document.getElementById("passwordInput");

const authButton =
    document.getElementById("authButton");

const switchButton =
    document.getElementById("switchButton");

const authSubtitle =
    document.getElementById("authSubtitle");

const errorMessage =
    document.getElementById("errorMessage");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const loggedUsername =
    document.getElementById("loggedUsername");

const memoryPanel =
    document.getElementById("memoryPanel");

const memoryOverlay =
    document.getElementById("memoryOverlay");

const memoryList =
    document.getElementById("memoryList");

const coreStatus =
    document.getElementById("coreStatus");

const statusLine =
    document.getElementById("statusLine");

const micButton =
    document.getElementById("micButton");


/* =====================================================
   ESTADO DO JARVIS
===================================================== */

function setStatus(text) {

    coreStatus.textContent = text;
    statusLine.textContent = text;

    statusLine.classList.add("active");

    setTimeout(() => {
        statusLine.classList.remove("active");
    }, 1200);
}


/* =====================================================
   LOGIN / REGISTO
===================================================== */

function switchAuthMode() {

    if (authMode === "login") {

        authMode = "register";

        authSubtitle.textContent =
            "Cria a tua conta JARVIS";

        authButton.textContent =
            "Criar conta";

        switchButton.textContent =
            "Já tenho uma conta";

    } else {

        authMode = "login";

        authSubtitle.textContent =
            "Entra na tua conta";

        authButton.textContent =
            "Entrar";

        switchButton.textContent =
            "Criar conta";
    }

    errorMessage.textContent = "";
}


async function authAction() {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    errorMessage.textContent = "";

    if (!username || !password) {

        errorMessage.textContent =
            "Preenche todos os campos.";

        return;
    }

    authButton.disabled = true;

    try {

        const endpoint =
            authMode === "login"
                ? "/login"
                : "/register";

        const response =
            await fetch(
                WORKER_URL + endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro no servidor."
            );
        }

        if (authMode === "register") {

            alert(
                "Conta criada com sucesso!"
            );

            authMode = "login";

            authSubtitle.textContent =
                "Entra na tua conta";

            authButton.textContent =
                "Entrar";

            switchButton.textContent =
                "Criar conta";

            passwordInput.value = "";

            return;
        }

        token = data.token;

        currentUsername =
            data.username;

        localStorage.setItem(
            "jarvis_token",
            token
        );

        showApp();

    } catch (error) {

        errorMessage.textContent =
            error.message;

    } finally {

        authButton.disabled = false;
    }
}


/* =====================================================
   LOGIN AUTOMÁTICO
===================================================== */

async function checkLogin() {

    if (!token) {

        showAuth();

        return;
    }

    try {

        const response =
            await fetch(
                WORKER_URL + "/me",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );

        const data =
            await response.json();

        if (!data.autenticado) {

            localStorage.removeItem(
                "jarvis_token"
            );

            token = null;

            showAuth();

            return;
        }

        currentUsername =
            data.username;

        showApp();

    } catch (error) {

        showAuth();
    }
}


function showApp() {

    authScreen.style.display =
        "none";

    appScreen.style.display =
        "block";

    loggedUsername.textContent =
        "Olá, " + currentUsername;

    setStatus("JARVIS ONLINE");

    messageInput.focus();
}


function showAuth() {

    authScreen.style.display =
        "flex";

    appScreen.style.display =
        "none";
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    try {

        if (token) {

            await fetch(
                WORKER_URL + "/logout",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );
        }

    } catch (error) {}

    localStorage.removeItem(
        "jarvis_token"
    );

    token = null;

    conversation = [];

    showAuth();
}


/* =====================================================
   CHAT
===================================================== */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) return;

    messageInput.value = "";

    setStatus("A PROCESSAR...");

    addMessage(
        "user",
        text
    );

    conversation.push({
        role: "user",
        content: text
    });

    const loading =
        addMessage(
            "jarvis",
            "A analisar..."
        );

    try {

        const response =
            await fetch(
                WORKER_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        messages:
                            conversation
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro no servidor."
            );
        }

        loading.remove();

        const answer =
            data.resposta ||
            "Não recebi uma resposta.";

        addMessage(
            "jarvis",
            answer
        );

        conversation.push({
            role: "assistant",
            content: answer
        });

        setStatus("A RESPONDER...");

        speak(answer);

        setTimeout(() => {
            setStatus("JARVIS ONLINE");
        }, 1800);

    } catch (error) {

        loading.remove();

        addMessage(
            "jarvis",
            "Erro: " + error.message
        );

        setStatus("ERRO DE SISTEMA");
    }
}


function addMessage(type, text) {

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            type === "user"
                ? "user"
                : "jarvis"
        );

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        type === "user"
            ? "TU"
            : "JARVIS";

    const content =
        document.createElement("div");

    content.textContent =
        text;

    div.appendChild(name);
    div.appendChild(content);

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

    return div;
}


function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


/* =====================================================
   VOZ
===================================================== */

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang =
        "pt-PT";

    utterance.rate =
        0.95;

    utterance.pitch =
        0.9;

    utterance.onstart = function() {

        setStatus("A FALAR...");

    };

    utterance.onend = function() {

        setStatus("JARVIS ONLINE");

    };

    speechSynthesis.speak(
        utterance
    );
}


/* =====================================================
   MICROFONE
===================================================== */

function startVoice() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {

        alert(
            "O teu navegador não suporta reconhecimento de voz."
        );

        return;
    }

    const recognition =
        new Recognition();

    recognition.lang =
        "pt-PT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    micButton.classList.add("listening");

    setStatus("A OUVIR...");

    recognition.start();

    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            messageInput.value =
                text;

            micButton.classList.remove(
                "listening"
            );

            sendMessage();
        };

    recognition.onerror =
        function() {

            micButton.classList.remove(
                "listening"
            );

            setStatus("JARVIS ONLINE");
        };

    recognition.onend =
        function() {

            micButton.classList.remove(
                "listening"
            );
        };
}


/* =====================================================
   MEMÓRIA
===================================================== */

function openMemoryPanel() {

    memoryPanel.classList.add("show");

    memoryOverlay.classList.add("show");

    loadMemories();
}


function closeMemoryPanel() {

    memoryPanel.classList.remove("show");

    memoryOverlay.classList.remove("show");
}


async function loadMemories() {

    memoryList.innerHTML =
        `<div class="no-memory">
            A carregar memórias...
        </div>`;

    try {

        const response =
            await fetch(
                WORKER_URL + "/memories",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao carregar memórias."
            );
        }

        renderMemories(
            data.memorias || []
        );

    } catch (error) {

        memoryList.innerHTML =
            `<div class="no-memory">
                Erro:<br><br>
                ${escapeHTML(error.message)}
            </div>`;
    }
}


function renderMemories(memories) {

    if (memories.length === 0) {

        memoryList.innerHTML =
            `<div class="no-memory">
                🧠<br><br>
                Ainda não tenho memórias guardadas.
                <br><br>
                Continua a conversar com o JARVIS.
            </div>`;

        return;
    }

    memoryList.innerHTML = "";

    memories.forEach(
        memory => {

            const item =
                document.createElement("div");

            item.className =
                "memory";

            const text =
                document.createElement("div");

            text.className =
                "memory-text";

            text.textContent =
                memory.memory;

            const date =
                document.createElement("div");

            date.className =
                "memory-date";

            date.textContent =
                memory.created_at
                    ? "Guardada em " +
                      memory.created_at
                    : "";

            const button =
                document.createElement("button");

            button.className =
                "memory-delete";

            button.textContent =
                "🗑️ Esquecer";

            button.onclick =
                function() {

                    deleteMemory(
                        memory.id
                    );
                };

            item.appendChild(text);
            item.appendChild(date);
            item.appendChild(button);

            memoryList.appendChild(item);
        }
    );
}


async function deleteMemory(id) {

    try {

        const response =
            await fetch(
                WORKER_URL + "/forget",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        id: id
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.erro ||
                "Erro ao apagar memória."
            );
        }

        loadMemories();

    } catch (error) {

        alert(
            "Erro: " +
            error.message
        );
    }
}


/* =====================================================
   SEGURANÇA
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* =====================================================
   INICIAR
===================================================== */

checkLogin();
